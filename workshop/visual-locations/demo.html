<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Locations Integration Smoke Test</title><style>body{font:16px system-ui;margin:20px auto;max-width:800px;padding:0 14px;background:#f7f7f2;color:#222}button{font:inherit;padding:12px;margin:5px;min-height:44px}canvas{width:100%;background:white;border:1px solid #888;touch-action:manipulation}#result{white-space:pre-wrap}</style><h1>Visual Locations integration test</h1><p>Two locations must switch independently. The same adapter works with farm and construction appearances.</p><canvas id="scene" width="800" height="400"></canvas><div><button id="bed">Change bed 1</button><button id="house">Change construction site</button><button id="clear">Clear bed 1</button></div><p id="result" role="status">Loading…</p><script type="module">
import {createVisualLocations} from './adapter.mjs';
const mk=(id,x,choice,states)=>({id,choices:[{id:choice,appearances:states.map((name,i)=>({id:name,asset:'assets/'+name+'.webp',x,y:190,width:130,height:100,rotation:0,layer:i+1}))}],touchZone:{type:'rectangle',x:x-65,y:140,width:130,height:100},action:'inspect-'+id});
const scene={format:'game-graphics-visual-locations',version:1,canvas:{width:800,height:400},locations:[mk('bed-01',200,'wheat',['growing','mature']),mk('construction-01',600,'habitat',['foundation','complete'])]};
const visuals=createVisualLocations(scene),canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),result=document.getElementById('result');let bed=0,house=0;
const draw=()=>{ctx.clearRect(0,0,800,400);ctx.fillStyle='#e8f4e4';ctx.fillRect(0,0,800,400);for(const item of visuals.visible()){ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.rotation*Math.PI/180);ctx.fillStyle=item.locationId==='bed-01'?(item.appearanceId==='growing'?'#79ba57':'#d8ad36'):(item.appearanceId==='foundation'?'#8d8d8d':'#547fa9');ctx.fillRect(-item.width/2,-item.height/2,item.width,item.height);ctx.fillStyle='#111';ctx.textAlign='center';ctx.font='18px system-ui';ctx.fillText(item.appearanceId,0,0);ctx.restore()}result.textContent=visuals.visible().map(i=>i.locationId+': '+i.choiceId+' / '+i.appearanceId).join('\n')||'All locations empty'};
visuals.select('bed-01','wheat','growing');visuals.select('construction-01','habitat','foundation');draw();
document.getElementById('bed').onclick=()=>{bed=1-bed;visuals.select('bed-01','wheat',bed?'mature':'growing');draw()};document.getElementById('house').onclick=()=>{house=1-house;visuals.select('construction-01','habitat',house?'complete':'foundation');draw()};document.getElementById('clear').onclick=()=>{visuals.select('bed-01');draw()};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*400/r.height;result.textContent='Touched: '+JSON.stringify(visuals.hitTest(x,y))};
</script></html>
